name: Update news

on:
  schedule:
    # Every 3 hours, a few minutes past the hour to avoid the busiest minute.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two updates at once; a late run waits for the earlier one.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Exits non-zero if every feed fails, so nothing below runs and the
      # previous data stays live. Without the API key the feeds and the
      # disaster map still publish; translation, shared-story grouping,
      # spotting disasters in headlines and web research are skipped.
      # Model spend is capped at $50 a month (pipeline/config/budget.json).
      - run: npm run pipeline:update
        # Inside the job's limit, so the step below can still save the spend.
        timeout-minutes: 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # When the update fails, the site's data stays as it was, but the
      # caches are saved: the model spend in cache/spend.json (so the
      # monthly cap sees it), and the translations and research it paid for.
      - name: Save caches after a failed update
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache
          if git diff --cached --quiet; then
            echo "No cache changes to save"
            exit 0
          fi
          git commit -m "Save caches after a failed update"
          git pull --rebase origin main
          git push

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data cache
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update news"
          git pull --rebase origin main
          git push
